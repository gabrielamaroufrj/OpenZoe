name: Build Flet App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Define a variável de ambiente para usar o Node 24 globalmente no workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      # Versões atualizadas que suportam Node 24 nativamente
      - uses: actions/checkout@v5 
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11' # Versão estável recomendada para 2026
          cache: 'pip'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install flet[all]

      - name: Build Executable
        run: |
          flet build windows

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-app-windows
          path: build/windows
