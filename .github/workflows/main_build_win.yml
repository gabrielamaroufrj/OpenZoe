name: Build Flet App (Modern)
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Cache para acelerar builds futuros

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          # Instala as dependências listadas no seu pyproject.toml
          pip install . 
          # Garante que o flet e ferramentas de build estejam presentes
          pip install flet[all] 

      - name: Build Executable
        run: |
          flet build windows

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-app-windows
          path: build/windows
