name: Build Flet Linux
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: 1

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5 
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libgcrypt20-dev \
            libmpv-dev \
            pkg-config \
            cmake \
            ninja-build

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet[all]
          # Tenta instalar apenas as dependências declaradas
          pip install . --only-binary :all: --no-deps || true
          # Força a instalação das dependências baseadas no arquivo, ignorando o erro de "multiple top-level packages"
          python -m pip install . --use-pep517 --config-settings="--global-option=--quiet" || echo "Seguindo com build..."

      - name: Build Executable
        run: |
          flet build linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-app-linux
          path: build/linux
